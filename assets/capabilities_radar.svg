  <line x1="400" y1="245" x2="400.0" y2="100.0" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
<line x1="400" y1="245" x2="525.6" y2="172.5" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
<line x1="400" y1="245" x2="525.6" y2="317.5" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
<line x1="400" y1="245" x2="400.0" y2="390.0" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
